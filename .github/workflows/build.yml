name: Build & Release Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process App Icon and Splash Screen Images
        run: |
          mkdir -p PokeApp/Assets.xcassets/AppIcon.appiconset
          mkdir -p PokeApp/Assets.xcassets/LaunchLogo.imageset

          if [ -f "poke.png" ]; then
            sips -Z 1024 "poke.png" --out "PokeApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
            echo "Processed poke.png -> AppIcon-1024.png"
          fi

          if [ -f "splash_screen.png" ]; then
            sips -Z 360 "splash_screen.png" --out "PokeApp/Assets.xcassets/LaunchLogo.imageset/LaunchLogo.png"
            echo "Processed splash_screen.png -> LaunchLogo.png"
          fi

      - name: Update Info.plist Build Version & Repo Key
        run: |
          plutil -replace CFBundleShortVersionString -string "1.0.${{ github.run_number }}" PokeApp/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" PokeApp/Info.plist
          plutil -replace GitHubRepository -string "${{ github.repository }}" PokeApp/Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' Poke.xcodeproj/project.pbxproj

      - name: Build App for iOS (Unsigned)
        run: |
          xcodebuild -project Poke.xcodeproj \
            -scheme Poke \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Standalone IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Poke.app Payload/
          zip -r Poke.ipa Payload

      - name: Create GitHub Release with Direct IPA Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Poke iOS v1.0.${{ github.run_number }}
          body_path: README.md
          files: Poke.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
