name: Build Poke iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag / Version (e.g., v1.0.25)'
        required: false
        default: ''

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project Poke.xcodeproj \
                     -scheme Poke \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Poke.app Payload/
          zip -r Poke.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poke.ipa
          path: Poke.ipa

      - name: Create Release (Optional if tag provided)
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: Poke.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
