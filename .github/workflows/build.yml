name: Build Poke iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        default: ''

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            NEW_VER="${{ github.event.inputs.release_tag }}"
            NEW_VER="${NEW_VER#v}"
            NEW_PATCH="${NEW_VER##*.}"
          else
            CUR_VER=$(plutil -extract CFBundleShortVersionString raw -o - PokeApp/Info.plist)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR_VER"
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          plutil -replace CFBundleShortVersionString -string "${NEW_VER}" PokeApp/Info.plist
          plutil -replace CFBundleVersion -string "${NEW_PATCH}" PokeApp/Info.plist

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PokeApp/Info.plist
          git commit -m "Bump version to ${NEW_VER}" || true
          git push || true

          echo "TAG_NAME=v${NEW_VER}" >> $GITHUB_OUTPUT

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          rm -rf Poke.xcodeproj
          xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild -project Poke.xcodeproj \
                     -scheme Poke \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Poke.app Payload/
          zip -r Poke.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poke.ipa
          path: Poke.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          files: Poke.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
