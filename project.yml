name: Poke
options:
  bundleIdPrefix: com.poke
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  objectVersion: 56   # <-- Forces Xcode 15 project format compatibility
targets:
  Poke:
    type: application
    platform: iOS
    sources: [PokeApp]
    settings:
      PRODUCT_NAME: "Poke"
      PRODUCT_BUNDLE_IDENTIFIER: com.poke.app
      INFOPLIST_FILE: PokeApp/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ENTITLEMENTS: ""
      CODE_SIGNING_ALLOWED: "NO"
